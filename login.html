<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Jarad Machinery & Electrical</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:#eef2ff;">
  <div class="card shadow-lg" style="max-width:420px;width:100%;">
    <div class="card-body p-4">
      <h4 class="mb-3 text-center" data-i18n="appName">Jarad Machinery & Electrical</h4>
      <p class="text-center text-muted mb-4">Owner: जराड प्रशांत | 9922556171</p>
      <div class="d-flex justify-content-center gap-2 mb-3">
        <button class="btn btn-outline-primary btn-sm lang-btn" data-lang="en">English</button>
        <button class="btn btn-outline-primary btn-sm lang-btn" data-lang="mr">मराठी</button>
      </div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" data-i18n="username">Username</label>
          <input class="form-control" id="username" required />
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="password">Password</label>
          <input type="password" class="form-control" id="password" required />
        </div>
        <button class="btn btn-primary w-100" data-i18n="login">Login</button>
      </form>
    </div>
  </div>
  <script src="js/translations.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      try {
        await login(username, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        alert(err.message || "Login failed");
      }
    });
    applyTranslations();
  </script>
</body>
</html>
