<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="loader-overlay" id="loader"><div class="spinner-border text-light"></div></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
  <div class="d-lg-flex app-shell">
    <aside class="sidebar p-2">
      <div class="brand" data-i18n="appName"></div>
      <nav class="nav flex-column mt-3">
        <a href="dashboard.html" class="nav-link" data-page="dashboard" data-i18n="dashboard"></a>
        <a href="products.html" class="nav-link" data-page="products" data-i18n="products"></a>
        <a href="vendors.html" class="nav-link" data-page="vendors" data-i18n="vendors"></a>
        <a href="customers.html" class="nav-link" data-page="customers" data-i18n="customers"></a>
        <a href="quotations.html" class="nav-link" data-page="quotations" data-i18n="quotations"></a>
        <a href="billing.html" class="nav-link" data-page="billing" data-i18n="billing"></a>
        <a href="payments.html" class="nav-link" data-page="payments" data-i18n="payments"></a>
        <a href="reports.html" class="nav-link" data-page="reports" data-i18n="reports"></a>
        <a href="settings.html" class="nav-link" data-page="settings" data-i18n="settings"></a>
        <button class="btn btn-outline-light btn-sm m-2" data-logout data-i18n="logout"></button>
      </nav>
    </aside>
    <main class="main-content flex-grow-1">
      <div class="topbar p-3 d-flex justify-content-between align-items-center">
        <h4 class="mb-0 page-title" data-i18n="dashboard"></h4>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-primary lang-btn" data-lang="en">English</button>
          <button class="btn btn-sm btn-outline-primary lang-btn" data-lang="mr">मराठी</button>
          <span id="loggedUserName" class="badge text-bg-secondary"></span>
        </div>
      </div>
      <div class="container-fluid p-3">
        <div class="row g-3" id="kpiCards"></div>
        <div class="row g-3 mt-1">
          <div class="col-lg-7"><div class="page-card p-3"><canvas id="monthlySalesChart"></canvas></div></div>
          <div class="col-lg-5"><div class="page-card p-3"><canvas id="productSalesChart"></canvas></div></div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
